name: Release

# Pushing a tag such as v1.2.3 publishes a GitHub release that Appfredo can install Scribe from:
# appfredo.json, the signed APK, and Wharf patches from the last releases, so that an update downloads only
# what changed instead of the whole ~700 MB APK. The tag has to point at a commit on main.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      BUTLER_VERSION: 15.32.0
      # The butler binary in that archive, the same build Appfredo publishes its own releases with.
      BUTLER_SHA256: 85ee65c71b59412a83d83bf332faab62c2c38f0ed569c9b13dadadf9823c7129
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, to tell whether the tagged commit is on main.
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi

      # The APK is mostly the speech model, and a release holds several copies of it: the build, the earlier
      # releases it patches from, and the copies the patching works on.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Butler
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/butler.zip" "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler/butler" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V
          echo "BUTLER=$RUNNER_TEMP/butler/butler" >> "$GITHUB_ENV"

      - name: Release key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Set the SIGNING_KEYSTORE and SIGNING_PASSWORD secrets before tagging a release."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SCRIBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      # Gradle downloads the speech model here, see the catalogue in app/build.gradle.kts.
      - name: Assemble the release
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIBE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash scripts/release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafted first, so that Appfredo never sees the release before every asset is attached.
          gh release create "$GITHUB_REF_NAME" build/release/"$GITHUB_REF_NAME"/* \
            --draft \
            --verify-tag \
            --title "Scribe ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Speech recognition by NVIDIA Parakeet TDT 0.6b v3 (CC BY 4.0), run on the device with sherpa-onnx."
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
