org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true

# The release workflow overrides these with the version in the tag it was started by.
scribe.versionName=0.1.0
scribe.versionCode=1

# Speech model bundled into the APK. Override per build with -Pscribe.model=<id>.
# The available ids are listed in the catalogue in app/build.gradle.kts.
scribe.model=parakeet-tdt-v3
